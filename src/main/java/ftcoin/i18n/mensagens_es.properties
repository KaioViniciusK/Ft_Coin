ajuda.titulo=Ayuda de FTCoin
ajuda.texto=FTCoin controla carteras de moneda virtual y calcula ganancias y pérdidas.\n\n\
CARTERA: agregue, consulte, edite y elimine carteras. Una cartera con movimientos no se puede eliminar.\n\n\
MOVIMIENTOS: registre compras y ventas indicando cartera, fecha y cantidad. Una venta no puede superar el saldo disponible. "Cotizar" muestra la cotización de una fecha, obtenida del servidor de cotizaciones.\n\n\
INFORMES: carteras por identificador o por titular; saldo actual; historial de movimientos; ganancia o pérdida. El costo medio es ponderado: cada compra lo modifica y cada venta genera ganancia o pérdida respecto a él. El resultado a mercado supone vender el saldo restante a la cotización más reciente.\n\n\
IDIOMA: el idioma sigue al del sistema y se puede cambiar en el menú Idioma.\n\n\
COTIZACIONES: vienen del servidor configurado en ftcoin.properties y se guardan en caché durante la ejecución. Sin el servidor, solo se pueden calcular las fechas ya consultadas.\n\n\
SALIR: cierra el programa y la conexión con la base de datos.
