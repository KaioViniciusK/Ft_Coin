ajuda.titulo=FTCoin help
ajuda.texto=FTCoin tracks virtual coin wallets and computes gains and losses.\n\n\
WALLET: add, view, edit and delete wallets. A wallet with transactions cannot be deleted.\n\n\
TRANSACTIONS: record purchases and sales with wallet, date and amount. A sale cannot exceed the available balance. "Quote" shows the quote for a date, obtained from the quote server.\n\n\
REPORTS: wallets by identifier or by holder; current balance; transaction history; gain or loss. The average cost is weighted: each purchase changes it, and each sale produces a gain or loss relative to it. The market result assumes the remaining balance is sold at the latest quote.\n\n\
LANGUAGE: the language follows the system and can be changed in the Language menu.\n\n\
QUOTES: quotes come from the server configured in ftcoin.properties and are cached during the run. Without the server, only dates already queried can be computed.\n\n\
EXIT: closes the program and the database connection.
