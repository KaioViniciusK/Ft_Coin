ajuda.titulo=Ajuda do FTCoin
ajuda.texto=O FTCoin acompanha carteiras de moeda virtual e apura ganhos e perdas.\n\n\
CARTEIRA: inclua, consulte, edite e exclua carteiras. Uma carteira com movimentações não pode ser excluída.\n\n\
MOVIMENTAÇÃO: registre compras e vendas informando carteira, data e quantidade. Uma venda não pode ultrapassar o saldo disponível. "Cotar" mostra a cotação de uma data, obtida do servidor de cotações.\n\n\
RELATÓRIOS: carteiras por identificador ou por titular; saldo atual; histórico de movimentação; ganho ou perda. O custo médio é ponderado: cada compra altera o custo médio, e cada venda gera ganho ou perda em relação a ele. O resultado a mercado supõe a venda do saldo restante pela cotação mais recente.\n\n\
IDIOMA: o idioma segue o do sistema e pode ser trocado no menu Idioma.\n\n\
COTAÇÕES: as cotações vêm do servidor configurado em ftcoin.properties e ficam em cache durante a execução. Sem o servidor, só é possível apurar datas já consultadas.\n\n\
SAIR: encerra o programa e fecha a conexão com o banco.
